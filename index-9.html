<style>
  :root{
    --white:#ffffff;
    --sky:#8fd0f0;        /* أزرق فاتح */
    --sky-soft:#dff1fb;   /* أزرق فاتح جدًا */
    --lubni:#eef8fb;      /* لبني */
    --blue:#1f7fb8;       /* أزرق للتفاصيل */
    --deep:#12405f;       /* أزرق غامق للنصوص */
    --muted:#4f6b80;
    --wa:#25d366;
    --wa-dark:#1da851;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Cairo','Segoe UI',Tahoma,sans-serif;
    background:var(--lubni);
    color:var(--deep);
    line-height:1.7;
  }
  img{max-width:100%;display:block}
  button{font-family:inherit;cursor:pointer}
  :focus-visible{outline:3px solid var(--blue);outline-offset:3px}

  /* ============ الشريط العلوي ============ */
  .topbar{
    position:sticky;top:0;z-index:50;
    background:var(--white);
    border-bottom:4px solid var(--sky);
    box-shadow:0 4px 16px rgba(31,127,184,.15);
  }
  .topbar-inner{
    max-width:1200px;margin:0 auto;
    display:flex;align-items:center;justify-content:center;
    gap:14px;padding:10px 16px;
  }
  .flag-circle,.party-logo{
    width:58px;height:58px;border-radius:50%;
    flex:0 0 auto;overflow:hidden;
    border:3px solid var(--sky);
    background:var(--white);
    box-shadow:0 2px 8px rgba(31,127,184,.25);
  }
  .flag-circle img,.party-logo img{width:100%;height:100%;object-fit:cover}
  .brand-name{
    font-family:'Reem Kufi','Cairo',sans-serif;
    font-weight:700;
    font-size:clamp(1.35rem,4.2vw,2.3rem);
    color:var(--deep);
    letter-spacing:.5px;
    white-space:nowrap;
  }

  /* ============ البانر الرئيسي ============ */
  .hero{
    background:var(--white);
    display:flex;justify-content:center;align-items:center;
    padding:clamp(12px,3vw,28px) 16px;
  }
  .hero img{
    height:clamp(220px,42vw,360px);
    width:auto;max-width:100%;
    object-fit:contain;
  }

  /* ============ الأمانات ============ */
  .secretariats{max-width:1000px;margin:0 auto;padding:44px 16px 64px}
  .section-head{text-align:center;margin-bottom:30px}
  .section-head h2{
    font-family:'Reem Kufi','Cairo',sans-serif;
    font-size:clamp(1.6rem,4vw,2.3rem);
    color:var(--deep);
  }
  .section-head p{color:var(--muted);margin-top:2px}
  .section-head::after{
    content:"";display:block;width:90px;height:5px;margin:14px auto 0;border-radius:3px;
    background:linear-gradient(to left,var(--sky),var(--blue));
  }

  .grid{
    display:flex;flex-wrap:wrap;justify-content:center;
    gap:clamp(8px,2vw,20px);
  }
  .tile{
    width:calc((100% - 2 * clamp(8px,2vw,20px)) / 3);
    aspect-ratio:1/1;
    background:var(--white);
    border:2px solid var(--sky-soft);
    border-radius:18px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(6px,1.6vw,14px);
    padding:clamp(6px,2vw,18px);
    text-align:center;
    color:var(--deep);
    position:relative;overflow:hidden;
    box-shadow:0 4px 14px rgba(31,127,184,.08);
    transition:transform .2s ease,border-color .2s ease,background .2s ease,box-shadow .2s ease;
  }
  .tile::before{
    content:"";position:absolute;top:0;right:0;left:0;height:6px;
    background:linear-gradient(to left,var(--sky),var(--blue));
  }
  .tile:hover{
    transform:translateY(-4px);
    background:var(--sky-soft);border-color:var(--sky);
    box-shadow:0 10px 24px rgba(31,127,184,.22);
  }
  .tile-icon{font-size:clamp(1.8rem,6.5vw,3.4rem);line-height:1}
  .tile-title{
    font-weight:700;
    font-size:clamp(.72rem,2.4vw,1.15rem);
    line-height:1.4;
  }

  /* ============ الخطوط الفاصلة الزرقاء ============ */
  .divider{
    width:100%;height:5px;border:0;
    background:var(--blue);
  }

  /* ============ المستطيلات الثلاثة ============ */
  .showcase{max-width:1000px;margin:0 auto;padding:44px 16px 64px}
  .showcase-grid{
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:clamp(10px,2vw,20px);
  }
  .rect{
    position:relative;aspect-ratio:3/2;
    border-radius:16px;overflow:hidden;
    background:var(--sky-soft);
    border:2px solid var(--sky-soft);
    box-shadow:0 6px 18px rgba(31,127,184,.15);
  }
  .rect img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:0;transition:opacity .6s ease;
  }
  .rect img.active{opacity:1}
  .rect-title{
    font-family:'Reem Kufi','Cairo',sans-serif;
    font-size:clamp(1.05rem,2.6vw,1.4rem);
    color:var(--deep);
    text-align:center;
    margin-bottom:12px;
  }
  .rect-title::after{
    content:"";display:block;width:50px;height:4px;margin:6px auto 0;border-radius:2px;
    background:linear-gradient(to left,var(--sky),var(--blue));
  }
  @media (max-width:700px){
    .showcase-grid{grid-template-columns:1fr}
    .rect{aspect-ratio:16/9}
  }

  /* ============ أزرار التواصل الدائرية ============ */
  .contact{max-width:1000px;margin:0 auto;padding:0 16px 64px}
  .contact-list{
    display:flex;flex-wrap:nowrap;justify-content:center;align-items:flex-start;
    gap:clamp(8px,3vw,44px);
  }
  .contact-item{
    display:flex;flex-direction:column;align-items:center;gap:12px;
    flex:1 1 0;max-width:200px;min-width:0;
    text-align:center;text-decoration:none;color:var(--deep);
  }
  .circle-btn{
    width:clamp(56px,17vw,88px);height:clamp(56px,17vw,88px);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:4px solid var(--white);
    box-shadow:0 6px 18px rgba(18,64,95,.3);
    transition:transform .2s ease,box-shadow .2s ease;
  }
  .circle-btn svg{width:50%;height:50%;fill:#fff}
  .contact-item:hover .circle-btn{transform:translateY(-4px) scale(1.06);box-shadow:0 12px 26px rgba(18,64,95,.35)}
  .contact-label{font-weight:700;font-size:clamp(.72rem,2.6vw,.98rem);line-height:1.55}

  /* ============ الأسئلة الشائعة ============ */
  .faq{max-width:800px;margin:0 auto;padding:0 16px 64px}
  .faq-list{display:flex;flex-direction:column;gap:12px}
  .faq-item{
    background:var(--white);
    border:2px solid var(--sky-soft);
    border-radius:14px;overflow:hidden;
    box-shadow:0 4px 14px rgba(31,127,184,.08);
    transition:border-color .2s ease;
  }
  .faq-item[open]{border-color:var(--sky)}
  .faq-item summary{
    list-style:none;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 18px;
    font-weight:700;font-size:clamp(1rem,2.6vw,1.15rem);
    color:var(--deep);
  }
  .faq-item summary::-webkit-details-marker{display:none}
  .faq-item summary::after{
    content:"";flex:0 0 auto;
    width:10px;height:10px;margin-top:-4px;
    border-right:3px solid var(--blue);border-bottom:3px solid var(--blue);
    transform:rotate(45deg);
    transition:transform .2s ease,margin .2s ease;
  }
  .faq-item[open] summary::after{transform:rotate(-135deg);margin-top:4px}
  .faq-answer{
    padding:0 18px 18px;
    color:var(--muted);line-height:1.9;
    border-top:1px solid var(--sky-soft);
    padding-top:14px;
  }
  .faq-item[open] .faq-answer{animation:fade .25s ease}

  /* ============ البانر السفلي ============ */
  .bottom-banner{max-width:1000px;margin:0 auto;padding:0 16px 48px}
  .bottom-banner img{
    width:100%;height:auto;display:block;
    border-radius:16px;
    border:2px solid var(--sky-soft);
    box-shadow:0 6px 18px rgba(31,127,184,.15);
  }

  /* ============ النافذة المنبثقة ============ */
  .modal{
    position:fixed;inset:0;z-index:100;
    display:none;align-items:center;justify-content:center;
    padding:16px;
    background:rgba(18,64,95,.55);
    backdrop-filter:blur(3px);
  }
  .modal.open{display:flex;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal-box{
    width:min(720px,100%);
    max-height:100%;overflow:auto;
    background:var(--white);border-radius:18px;
    border-top:6px solid var(--sky);
    box-shadow:0 20px 60px rgba(18,64,95,.35);
    position:relative;
  }
  .modal-close{
    position:absolute;top:10px;left:10px;z-index:5;
    width:40px;height:40px;border-radius:50%;
    border:none;background:var(--white);color:var(--deep);
    font-size:1.5rem;line-height:1;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
  }
  .modal-close:hover{background:var(--sky-soft)}
  .slider{
    position:relative;width:100%;aspect-ratio:16/8;
    background:var(--sky-soft);overflow:hidden;
  }
  .slider img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:0;transition:opacity .6s ease;
  }
  .slider img.active{opacity:1}
  .dots{
    position:absolute;bottom:10px;right:0;left:0;
    display:flex;justify-content:center;gap:8px;z-index:2;
  }
  .dots span{
    width:10px;height:10px;border-radius:50%;
    background:rgba(255,255,255,.7);transition:background .3s,transform .3s;
  }
  .dots span.active{background:var(--blue);transform:scale(1.25)}

  /* الفيديو أسفل الصور المتحركة */
  .video-wrap{
    position:relative;width:100%;aspect-ratio:16/9;
    background:var(--deep);
  }
  .video-wrap video,.video-wrap iframe{
    position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;
  }
  .video-missing{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--sky-soft);color:var(--muted);
    font-weight:600;text-align:center;padding:16px;
  }

  .modal-body{padding:22px 22px 26px;text-align:center;background:var(--lubni)}
  .modal-body h3{
    font-family:'Reem Kufi','Cairo',sans-serif;
    font-size:clamp(1.3rem,4vw,1.8rem);color:var(--deep);
  }
  .modal-body p{color:var(--muted);margin:4px 0 18px}
  .wa-btn{
    display:inline-flex;align-items:center;gap:10px;
    background:var(--wa);color:#fff;text-decoration:none;
    font-weight:700;font-size:1.1rem;
    padding:12px 28px;border-radius:50px;
    box-shadow:0 6px 16px rgba(37,211,102,.4);
    transition:background .2s,transform .2s;
  }
  .wa-btn:hover{background:var(--wa-dark);transform:translateY(-2px)}
  .wa-btn svg{width:26px;height:26px;fill:#fff}

  /* ============ التذييل ============ */
  footer{
    background:var(--sky-soft);color:var(--deep);
    text-align:center;padding:22px 16px;font-size:.95rem;
    border-top:4px solid var(--sky);
  }

  @media (max-width:520px){
    .flag-circle,.party-logo{width:44px;height:44px;border-width:2px}
    .topbar-inner{gap:8px;padding:8px 10px}
    .tile{border-radius:12px}
    .modal-close{width:36px;height:36px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>

<!-- الشريط العلوي: علم مصر دائري + اسم الحزب + شعار الحزب -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="flag-circle">
      <img id="flagImg" src="images/egypt-flag.png" alt="علم جمهورية مصر العربية">
    </div>

function svgUri(svg){ return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); }

function placeholderBanner(title, n){
  const palettes = [["#2f8fc8","#8fd0f0"],["#1f7fb8","#5bb4e5"]];
  const [c1,c2] = palettes[(n-1) % 2];
  return svgUri(`<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
    <defs><linearGradient id="g" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    <rect width="1200" height="600" fill="url(#g)"/>
    <rect y="560" width="1200" height="40" fill="#ffffff" fill-opacity=".85"/>
    <text x="600" y="290" text-anchor="middle" font-family="Cairo,Tahoma,sans-serif" font-size="72" font-weight="700" fill="#ffffff">${title}</text>
    <text x="600" y="370" text-anchor="middle" font-family="Cairo,Tahoma,sans-serif" font-size="36" fill="#12405f">حزب مستقبل وطن</text>
  </svg>`);
}

  const el = document.createElement("div");
  el.className = "rect";
  box.images.forEach((src, n) => {
    const img = document.createElement("img");
    img.alt = box.title || "صورة من أنشطة الحزب";
    img.src = src;
    img.addEventListener("error", () => { img.src = placeholderBanner("صورة " + (b + 1), n + 1); }, {once:true});
    if (n === 0) img.classList.add("active");
    el.appendChild(img);
  });
  const dots = document.createElement("div");
  dots.className = "dots";
  dots.innerHTML = box.images.map((_, n) => `<span class="${n===0?"active":""}"></span>`).join("");
  el.appendChild(dots);
  showcaseGrid.appendChild(card);
  if (box.title) card.appendChild(heading);
  card.appendChild(el);
  return { el, current: 0 };
});

setInterval(() => {
  showcaseBoxes.forEach(box => {
    const imgs = box.el.querySelectorAll("img");
    const dots = box.el.querySelectorAll(".dots span");
    if (imgs.length < 2) return;
    imgs[box.current].classList.remove("active");
    dots[box.current].classList.remove("active");
    box.current = (box.current + 1) % imgs.length;
    imgs[box.current].classList.add("active");
    dots[box.current].classList.add("active");
  });
}, SLIDE_INTERVAL);

/* ---------- الفيديو ---------- */
function youtubeEmbed(url){
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/))([\w-]{11})/);
  return m ? "https://www.youtube.com/embed/" + m[1] + "?rel=0" : null;
}

function buildVideo(s){
  const wrap = document.getElementById("videoWrap");
  wrap.innerHTML = "";
  wrap.style.display = "";
  if (!s.video){ wrap.style.display = "none"; return; }

  const missing = () => {
    wrap.innerHTML = '<div class="video-missing">الفيديو غير متاح حاليًا</div>';
  };

  const yt = youtubeEmbed(s.video);
  if (yt){
    const f = document.createElement("iframe");
    f.src = yt;
    f.title = s.name;
    f.allow = "accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen";
    f.allowFullscreen = true;
    f.loading = "lazy";
    wrap.appendChild(f);
  } else {
    const v = document.createElement("video");
    v.controls = true;
    v.playsInline = true;
    v.preload = "metadata";
    v.src = s.video;
    v.addEventListener("error", missing, {once:true});
    wrap.appendChild(v);
  }
}

/* ---------- النافذة والسلايدر ---------- */
const modal   = document.getElementById("modal");
const slider  = document.getElementById("slider");
const titleEl = document.getElementById("modalTitle");
const waBtn   = document.getElementById("waBtn");
let timer = null, current = 0, lastFocus = null;

function openModal(index){
  const s = SECTIONS[index];
  lastFocus = document.activeElement;
  titleEl.textContent = s.name;
  waBtn.href = "https://wa.me/" + s.phone + "?text=" + encodeURIComponent(WA_MESSAGE + " - " + s.name);

  slider.innerHTML = "";
  s.images.forEach((src, n) => {
    const img = document.createElement("img");
    img.alt = s.name;
    img.src = src;
    img.addEventListener("error", () => { img.src = placeholderBanner(s.name, n + 1); }, {once:true});
    if (n === 0) img.classList.add("active");
    slider.appendChild(img);
  });
  const dots = document.createElement("div");
  dots.className = "dots";
  dots.innerHTML = s.images.map((_, n) => `<span class="${n===0?"active":""}"></span>`).join("");
  slider.appendChild(dots);

  buildVideo(s);

  current = 0;
  modal.classList.add("open");
  document.body.style.overflow = "hidden";
  document.getElementById("modalClose").focus();

  clearInterval(timer);
  timer = setInterval(nextSlide, SLIDE_INTERVAL);
}

function nextSlide(){
  const imgs = slider.querySelectorAll("img");
  const dots = slider.querySelectorAll(".dots span");
  if (imgs.length < 2) return;
  imgs[current].classList.remove("active");
  dots[current].classList.remove("active");
  current = (current + 1) % imgs.length;
  imgs[current].classList.add("active");
  dots[current].classList.add("active");
}

function closeModal(){
  modal.classList.remove("open");
  document.body.style.overflow = "";
  clearInterval(timer);
  slider.innerHTML = "";
  document.getElementById("videoWrap").innerHTML = ""; // يوقف الفيديو
  if (lastFocus) lastFocus.focus();
}

document.getElementById("modalClose").addEventListener("click", closeModal);
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && modal.classList.contains("open")) closeModal(); });
</script>
